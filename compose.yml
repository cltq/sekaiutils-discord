services:
  bot:
    build: .
    working_dir: /app
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_CREATOR=${BOT_CREATOR}
    command: python3 bot.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:88990', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
